name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'web-flasher/**'
      - 'clockface-editor/**'
      - 'docs/**'
      - 'scripts/build-docs.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install markdown renderer
        run: npm install marked@12 --no-save

      - name: Assemble site
        run: |
          mkdir -p _site
          # Landing page at the site root (its links already point to web-flasher/, clockface-editor/, docs/)
          cp index.html _site/index.html
          # Web flasher
          cp -r web-flasher _site/web-flasher
          # Clockface editor (folder name must match the landing page links)
          cp -r clockface-editor _site/clockface-editor
          # Documentation (manuals, images, guides)
          cp -r docs _site/docs
          # Render every markdown file in docs/ to styled HTML
          node scripts/build-docs.mjs _site/docs
          # Disable Jekyll so folders/files are served as-is
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
