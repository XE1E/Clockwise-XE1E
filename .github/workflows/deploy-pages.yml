name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web-flasher/**'
      - 'clockface-editor/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create site structure
        run: |
          mkdir -p _site
          # Web Flasher as root (main page)
          cp -r web-flasher/* _site/
          # Editor in /editor subfolder
          mkdir -p _site/editor
          cp -r clockface-editor/* _site/editor/
          # Docs in /docs subfolder
          mkdir -p _site/docs
          cp -r docs/* _site/docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
