name: Build Firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'clockface-editor/js/pixel-fonts.js'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build firmware
        run: |
          cd firmware
          pio run --environment esp32dev

      - name: Get version info
        id: version
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "time=$(date +'%H%M')" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Rename firmware file
        run: |
          cp firmware/.pio/build/esp32dev/firmware.bin firmware-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}
          path: firmware-*.bin
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' || github.event.inputs.release_name != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.date }}.${{ steps.version.outputs.time }}
          name: ${{ github.event.inputs.release_name || format('Firmware {0}', steps.version.outputs.date) }}
          body: |
            ## Firmware Build

            - **Commit**: ${{ github.sha }}
            - **Date**: ${{ steps.version.outputs.date }}
            - **Branch**: ${{ github.ref_name }}

            ### Changes
            ${{ github.event.head_commit.message }}

            ### Installation
            1. Download `firmware-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}.bin`
            2. Use [ESP Web Tools](https://web.esphome.io/) or esptool to flash

          files: firmware-*.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
