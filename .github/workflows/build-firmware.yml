name: Build Firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'clockface-editor/js/pixel-fonts.js'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Sync fonts (pixel-fonts.js → firmware)
        run: |
          node scripts/sync-fonts.js
          echo "Generated font files:"
          ls -la firmware/clockfaces/cw-cf-0x07/fonts/*_gen.h 2>/dev/null || echo "No generated files"
          ls -la firmware/clockfaces/cw-cf-0x07/fonts/_*.txt 2>/dev/null || echo "No template files"

      - name: Build firmware (ESP32)
        run: |
          cd firmware
          pio run --environment esp32dev

      - name: Build firmware (ESP32-S3)
        run: |
          cd firmware
          pio run --environment esp32s3

      - name: Get version info
        id: version
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "time=$(date +'%H%M')" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          # Extraer la version semantica de CW_FW_VERSION en platformio.ini
          SEMVER=$(grep -m1 'CW_FW_VERSION' firmware/platformio.ini | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?')
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT
          # Marcar pre-release si la version contiene beta/rc/alpha
          if echo "$SEMVER" | grep -qiE 'beta|rc|alpha'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "Firmware semver: $SEMVER (prerelease: $(echo "$SEMVER" | grep -qiE 'beta|rc|alpha' && echo true || echo false))"

      - name: Prepare firmware files
        run: |
          mkdir -p release-files
          cp firmware/.pio/build/esp32dev/firmware.bin release-files/firmware-esp32-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}.bin
          cp firmware/.pio/build/esp32s3/firmware.bin release-files/firmware-esp32s3-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}.bin

      - name: Upload firmware artifact (ESP32)
        uses: actions/upload-artifact@v6
        with:
          name: firmware-esp32-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}
          path: release-files/firmware-esp32-*.bin
          retention-days: 30

      - name: Upload firmware artifact (ESP32-S3)
        uses: actions/upload-artifact@v6
        with:
          name: firmware-esp32s3-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}
          path: release-files/firmware-esp32s3-*.bin
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' || github.event.inputs.release_name != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.date }}.${{ steps.version.outputs.time }}
          name: ${{ github.event.inputs.release_name || format('Firmware {0} ({1})', steps.version.outputs.semver, steps.version.outputs.date) }}
          body: |
            ## Firmware Build

            - **Version**: ${{ steps.version.outputs.semver }}
            - **Commit**: ${{ github.sha }}
            - **Date**: ${{ steps.version.outputs.date }}
            - **Branch**: ${{ github.ref_name }}

            ### Supported Boards
            - **ESP32** (esp32doit-devkit-v1)
            - **ESP32-S3** (esp32-s3-devkitc-1)

            ### Changes
            ${{ github.event.head_commit.message }}

            ### Installation
            1. Download the firmware for your board
            2. Use [Web Flasher](https://xe1e.github.io/Clockwise-XE1E/web-flasher/) or esptool to flash

          files: release-files/firmware-*.bin
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
